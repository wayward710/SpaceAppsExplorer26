name = "spaceapps-project-explorer"
main = "src/worker.js"
compatibility_date = "2026-11-01"

[assets]
directory = "./public"
binding = "ASSETS"

# After `npx wrangler d1 create spaceapps-catalog`, paste the returned database_id below.
[[d1_databases]]
binding = "DB"
database_name = "spaceapps-catalog"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
